name: CI

# 触发:合入 main 的推送 + 针对 main 的 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 只保留最新一次运行,旧的在跑就取消(省 runner 分钟、快反馈)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端测试门禁:macOS(arm64)——与开发/打包目标平台一致,mlx-whisper 仅在此平台装。
  backend:
    name: backend pytest (macOS)
    runs-on: macos-latest
    # 首次冷装依赖含 torch/FlagEmbedding/transformers/pymilvus,约 5-10 分钟;
    # 叠加测试执行 + 冷缓存,给足余量避免误杀正常运行。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 依赖清单在 backend/pyproject.toml,以它为 pip 缓存键。
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          # runner 镜像残留一个残缺的 pkg_resources(可导入但没有 resource_stream),
          # 且不随 setuptools 卸载/升级被清掉 → jieba 的 pkg_resources 兼容层直接炸。
          # 后装完整版覆盖之:<81 是 pkg_resources API 完整的最后区间,与本地 dev venv 行为一致;
          # --force-reinstall 确保 pkg_resources 目录被重写。
          python -m pip install --force-reinstall "setuptools>=80,<81"
          # 诊断(不挡构建):确认 pkg_resources 来源与 resource_stream 是否齐全。
          python -c "import pkg_resources; print('pkg_resources from:', pkg_resources.__file__, '| has resource_stream:', hasattr(pkg_resources,'resource_stream'))"

      # 重模型测试由 EPICTRACE_RUN_SLOW 门控,此处不设该变量 → 自动跳过。
      # 预期:752 passed / 7 skipped。
      - name: Run backend tests
        run: cd backend && pytest -q

  # 前端构建门禁:Ubuntu 即可(纯 Node 构建,无平台相关原生依赖)。
  frontend:
    name: frontend build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json 无 engines 约束,取当前 LTS(vite 8 要求 Node 20.19+/22.12+)。
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # build = "tsc -b && vite build":已含类型检查。lint 存量告警不做门禁。
      - name: Build frontend
        working-directory: frontend
        run: npm run build
